    <script>
      // First visit in this tab: start on the white page of the opening scene (a fake 404), so nothing flashes dark first.
      // Crawlers and link previews get the real page instead: a bot must never think the homepage is an error page.
      try {
        if (/bot|crawl|spider|slurp|lighthouse|facebookexternalhit|whatsapp/i.test(navigator.userAgent)) sessionStorage.setItem('mk-intro', '1');
        if (!sessionStorage.getItem('mk-intro') && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.className = 'pro';
      } catch (e) {}
    </script>
    <title>Mazin Kazi | React Native Developer</title>
